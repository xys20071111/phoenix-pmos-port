Syntax 4

# UCM for Lenovo PHAB Plus (phoenix), card "phoenix" (apq8016-sbc-sndcard).
# Proven control set from manual bringup (BOOT-STATUS.md "音频输出打通"):
#  - old LPASS has no route mixer (DMA hardwired), nothing to set there
#  - internal codec PDM path; speaker (mono) hangs off RX3, fed from RX1
#  - HPHL/HPHR are enums (ZERO/Switch), not boolean switches
SectionVerb {
	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RX1 Digital Volume' 68%"
		cset "name='RX2 Digital Volume' 68%"
		cset "name='RX3 Digital Volume' 68%"
		cset "name='RX1 Mute Switch' off"
		cset "name='RX2 Mute Switch' off"
		cset "name='RX3 Mute Switch' off"
		cset "name='RDAC2 MUX' RX2"
	]

	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='SPK DAC Switch' on"
	]

	DisableSequence [
		cset "name='SPK DAC Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]

	DisableSequence [
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Headset microphone (capture link pending runtime check)"

	Value {
		CapturePCM "hw:${CardId},1"
	}
}
